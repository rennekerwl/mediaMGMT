[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-scope"
version = "0.1.0"
description = "Resolve the exact TMDb acquisition scope for released movies and ended TV series."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
media-scope = "media_scope.cli:main"
media-search-tv = "media_scope.search_cli:main"
media-probe-torrents = "media_scope.probe_cli:main"
media-download-torrent = "media_scope.download_cli:main"

[tool.setuptools.packages.find]
include = ["media_scope*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

